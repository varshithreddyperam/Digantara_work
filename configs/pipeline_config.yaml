# Digantara SSA Annotation & Tiling Pipeline Configuration

data:
  fits_dir: "Datasets_Assessment"
  output_dir: "data/processed"
  submission_dir: "submission"
  
tiling:
  tile_size: 1024
  pad_mode: "constant"
  pad_value: 0

preprocessing:
  grid_size: 128
  p_low: 0.5
  p_high: 99.8
  asinh_scale: 3.0

detection:
  k_core: 3.8
  k_boundary: 2.0
  min_pixels: 3
  max_pixels: 50000

classification:
  min_star_area: 3
  min_streak_length: 15.0
  streak_axis_ratio_thresh: 1.95
  max_star_axis_ratio: 1.65

yolo:
  polygon_epsilon: 1.0
  min_polygon_area: 2.0
